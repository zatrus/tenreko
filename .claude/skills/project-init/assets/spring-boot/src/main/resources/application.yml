spring:
  application:
    name: app
  mvc:
    problemdetails:
      enabled: true
  # jpa:
  #   open-in-view: false
  #   hibernate:
  #     ddl-auto: validate
  # datasource:
  #   url: ${DB_URL:jdbc:postgresql://localhost:5432/app}
  #   username: ${DB_USER:app}
  #   password: ${DB_PASSWORD}

server:
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs

app:
  greeting:
    template: "Hello, %s!"
