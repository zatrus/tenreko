[project]
name = "app"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# ---------- ruff: formatter + linter ----------
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # naming
    "S",        # bandit (security)
    "BLE",      # no blind except
    "RET",      # return consistency
    "PTH",      # pathlib over os.path
    "PL",       # pylint subset
    "RUF",      # ruff-specific
    "T20",      # no print
    "ERA",      # no commented-out code
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]  # assert and magic numbers are fine in tests

# ---------- mypy ----------
[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
warn_unreachable = true

# ---------- pytest + coverage ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=80"
markers = ["integration: touches real I/O (db, network, filesystem)"]

[tool.coverage.run]
branch = true
source = ["app"]
