# All versions live here. Add dependencies with an alias, then use libs.<alias> in build.gradle.kts.
[versions]
junit = "6.1.3"
assertj = "3.27.7"
jacoco = "0.8.15"
spotless = "8.10.4"

[libraries]
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
